<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LB → pain.001 V0.93</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f7fa;
    color:#333;
}

.container{
    max-width:900px;
    margin:50px auto;
    padding:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    margin-bottom:10px;
}

.subtitle{
    margin-bottom:30px;
    color:#666;
}

label{
    display:block;
    font-weight:600;
    margin-top:20px;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    margin-top:30px;
    padding:14px 30px;
    border:none;
    border-radius:6px;
    background:#0066cc;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0052a3;
}

textarea{
    width:100%;
    height:300px;
    margin-top:20px;
    border:1px solid #ccc;
    border-radius:6px;
    padding:15px;
    font-family:Consolas,monospace;
}

.status{
    margin-top:20px;
    font-weight:bold;
}

.success{
    color:green;
}

.payment-summary{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px 24px;
    margin-top:20px;
    padding:18px;
    border:1px solid #d9e2ec;
    border-radius:8px;
    background:#f8fafc;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:8px 0;
    border-bottom:1px solid #e5e7eb;
}

.summary-row:last-child,
.summary-row:nth-last-child(2){
    border-bottom:0;
}

.summary-label{
    font-weight:600;
}

.summary-value{
    text-align:right;
    white-space:nowrap;
}

.summary-mismatch{
    color:red;
    font-weight:bold;
}

.error{
    color:red;
}

</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>LB → pain.001 </h1>

        <p class="subtitle">
            Ladda upp en LB-fil och generera en ISO20022 pain.001 XML enligt LF Bank MIG version 0
            <br>Kredditnotor och kontantutbetalningar är ej tillåtet. Kontoinsättningar med avisering är inte möjligt inom ISO <br>
    

        </p>

        <label>LB Fil</label>
        <input type="file" id="fileInput">

        <label>Företagsnamn</label>
        <input
            type="text"
            id="companyName"
            value="Converted LB">

        <label>Organisationsnummer på betalare</label>
        <input
            type="text"
            id="orgNo"
            value="556677-1234">

        <button id="convertBtn">
            Konvertera till pain.001
        </button>

        <div id="status" class="status"></div>

        <div id="paymentSummary" class="payment-summary" hidden></div>

        
        <textarea
            id="LBOut"
            placeholder="LB file content..."
        ></textarea>

        <textarea
            id="xmlPreview"
            placeholder="XML preview..."
        ></textarea>

    </div>

</div>

<script>

document
.getElementById("convertBtn")
.addEventListener("click", convertFile);


function convertFile() {

    const file =
        document.getElementById("fileInput").files[0];

    if(!file){
        showStatus(
            "Vänligen ladda upp en fil att konvertera",
            true
        );
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const lbContent = e.target.result;

        document
            .getElementById("LBOut")
            .value = lbContent;

        const companyName =
            document.getElementById("companyName").value;

        const orgNo =
            document.getElementById("orgNo").value
                .trim()
                .replace(/-/g, "");

        const lbData =
            parseLB(lbContent);

        if(lbData.error){
            showStatus(lbData.error, true);
            return;
        }

        document
            .getElementById("xmlPreview")
            .value = "";

        const totalsCheck =
            validatePaymentTotals(lbData.payments, lbData.footer);

        showPaymentSummary(
            lbData.payments,
            lbData.footer,
            totalsCheck
        );

        if(!totalsCheck.valid){
            showStatus(totalsCheck.message, true);
            return;
        }

        const xml =
            createPain001(
                lbData,
                companyName,
                orgNo,
            );

        document
            .getElementById("xmlPreview")
            .value = xml;

        const inputFileName =
            file.name.replace(/\.[^.]+$/, "");

        downloadXML(
            xml,
            inputFileName + formatShortDate(new Date()) + ".xml"
        );

        showStatus(
            "Konverteringen är klar",
            false
        );

    };

    reader.readAsText(file);
}


function showPaymentSummary(payments, footer, totalsCheck){

    const summary = document.getElementById("paymentSummary");

    const categories = {
        giro: payments.filter(payment =>
            payment.isBgNumber && payment.salary !== "L"
        ),
        transfer: payments.filter(payment =>
            !payment.isBgNumber && payment.salary !== "L"
        ),
        salary: payments.filter(payment =>
            payment.salary === "L"
        )
    };

    const rows = [
        ["Antal gireringar", "Belopp gireringar", categories.giro],
        ["Antal överföringar", "Belopp överföringar", categories.transfer],
        ["Antal lönebetalningar", "Belopp lönebetalningar", categories.salary],
        ["Totalt antal betalningar", "Totalt belopp", payments]
    ];

    summary.innerHTML = rows.map(([countLabel, amountLabel, items], index) => `
        <div class="summary-row">
            <span class="summary-label">${countLabel}</span>
            <span class="summary-value ${index === 3 && totalsCheck && !totalsCheck.countMatches ? "summary-mismatch" : ""}">${items.length}</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">${amountLabel}</span>
            <span class="summary-value ${index === 3 && totalsCheck && !totalsCheck.amountMatches ? "summary-mismatch" : ""}">${formatAmount(items)}</span>
        </div>
    `).join("");

    summary.innerHTML += `
        <div class="summary-row">
            <span class="summary-label">Antal bet från LB</span>
            <span class="summary-value ${totalsCheck && !totalsCheck.countMatches ? "summary-mismatch" : ""}">${footer ? footer.paymentCount : "-"}</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">Totalt belopp från LB</span>
            <span class="summary-value ${totalsCheck && !totalsCheck.amountMatches ? "summary-mismatch" : ""}">${footer ? formatAmountValue(footer.totalAmount) : "-"}</span>
        </div>
    `;

    summary.hidden = false;
}


function validatePaymentTotals(payments, footer){

    if(!footer){
        return {
            valid: false,
            countMatches: false,
            amountMatches: false,
            message: "Fel: slutpost TK29 saknas i LB-filen. Ingen XML skapades."
        };
    }

    const paymentCount = payments.length;
    const paymentAmount = payments.reduce(
        (total, payment) => total + payment.amount,
        0
    );
    const countMatches = paymentCount === footer.paymentCount;
    const amountMatches =
        Math.round(paymentAmount * 100) ===
        Math.round(footer.totalAmount * 100);

    if(countMatches && amountMatches){
        return {
            valid: true,
            countMatches,
            amountMatches,
            message: ""
        };
    }

    const errors = [];

    if(!countMatches){
        errors.push(`antal betalningar (${paymentCount} mot ${footer.paymentCount})`);
    }

    if(!amountMatches){
        errors.push(`belopp (${formatAmountValue(paymentAmount)} mot ${formatAmountValue(footer.totalAmount)})`);
    }

    return {
        valid: false,
        countMatches,
        amountMatches,
        message: `Fel i LB-kontroll: ${errors.join(" och ")}. Ingen XML skapades.`
    };
}


function formatAmount(payments){

    const amount = payments.reduce(
        (total, payment) => total + payment.amount,
        0
    );

    return formatAmountValue(amount);
}


function formatAmountValue(amount){

    return amount.toLocaleString("sv-SE", {
        style: "currency",
        currency: "SEK"
    });
}


function parseLB(content){

    const lines = content.split(/\r?\n/);

    const result = {

        header: {},

        payments: [],

        footer: null,

        record40: null

    };

    lines.forEach(line => {

        if(line.length < 2){
            return;
        }

        const recordType = line.substring(0,2);

        if(recordType === "15" || recordType === "16" || recordType === "17"){
            result.error = "kreditnotor ej tillåtna i filen";
            return;
        }

        //
        // POST 11
        //
        if(recordType === "11"){

            result.header.bgNo =
                line.substring(2,12).trim();

            result.header.createDate =
                line.substring(12,18).trim();

            result.header.payDate =
                line.substring(40,46).trim();

            return;
        }

        if(recordType === "40"){

            const clnr = line.substring(12,16).trim();

            result.record40 = {
                clnr: clnr.startsWith("8")
                    ? clnr + calculate10ModulusCheckDigit(clnr)
                    : clnr,
                accountNo: line.substring(16,28).trim().replace(/^0+/, ""),
                reference: line.substring(28,40).trim(),
                salary: line.substring(40).trim()
            };

            return;
        }

        if(recordType === "29"){

            result.footer = {
                bgNo: line.substring(2,12).trim(),
                paymentCount: Number(line.substring(12,20).trim()),
                totalAmount: Number(line.substring(20,32).trim()) / 100
            };

            return;
        }

        if(recordType === "26"){

            const paymentNumber = line.substring(6,12).trim();
            const payment = result.payments.find(item =>
                item.paymentNumber === paymentNumber
            );

            if(payment){
                payment.name = line.substring(12,47).trim();
            }

            return;
        }

        //
        // POST 14/54 contain supplier payments.
        //
        if(recordType === "14" || recordType === "54"){

            const bgOrBet = line.substring(2,12).trim();
            const ocrOrRef = line.substring(12,37).trim();
            const amount = line.substring(37,49).trim();
            const betDate = line.substring(49,55).trim();

            const record40 = recordType === "14"
                ? result.record40
                : null;

            result.payments.push({

                paymentNumber: line.substring(6,12).trim(),

                bgOrBet,

                ocrOrRef,

                amount: Number(amount) / 100,

                betDate,

                name: "",

                account: record40
                    ? record40.clnr + record40.accountNo
                    : bgOrBet,

                isBgNumber: !record40,

                reference: record40 && record40.reference
                    ? record40.reference
                    : ocrOrRef,

                clnr: record40 ? record40.clnr : "",

                salary: record40 ? record40.salary : ""

            });

            if(recordType === "14"){
                result.record40 = null;
            }

            return;
        }

    });

    console.log(result);

    return result;
}


function calculate10ModulusCheckDigit(value){

    let sum = 0;
    let multiplier = 2;

    for(let index = value.length - 1; index >= 0; index--){

        const product = Number(value[index]) * multiplier;

        sum += Math.floor(product / 10) + product % 10;
        multiplier = multiplier === 2 ? 1 : 2;
    }

    return String((10 - sum % 10) % 10);
}


function createPain001(
    lbData,
    companyName,
    OrgNo
){

    const payments = lbData.payments;

    const messageId =
        "MSG-" + formatMessageDate(new Date());

    const creationDate =
        formatLBDate(lbData.header.createDate) + "T00:00:00";

    const debtBG =
        lbData.header.bgNo.replace(/^0{2,3}/, "");

    let totalAmount = 0;

    payments.forEach(p => {
        totalAmount += p.amount;
    });

    let xml = '';

    const headerPayDate = lbData.header.payDate &&
        !/^0+$/.test(lbData.header.payDate)
        ? lbData.header.payDate
        : "";

    const paymentGroups = [];

    payments.forEach(payment => {

        const executionDate = headerPayDate || payment.betDate;
        const isSalary = payment.salary === "L";

        let group = paymentGroups.find(item =>
            item.executionDate === executionDate &&
            item.isSalary === isSalary
        );

        if(!group){
            group = {
                executionDate,
                isSalary,
                payments: []
            };
            paymentGroups.push(group);
        }

        group.payments.push(payment);
    });

    let transactionIndex = 1;

    xml += '<?xml version="1.0" encoding="UTF-8"?>\n';
    xml += `<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03">
    <CstmrCdtTrfInitn>
        <GrpHdr>
            <MsgId>${messageId}</MsgId>
            <CreDtTm>${creationDate}</CreDtTm>
            <NbOfTxs>${payments.length}</NbOfTxs>
            <CtrlSum>${totalAmount.toFixed(2)}</CtrlSum>
            <InitgPty>
                    <Nm>${escapeXml(companyName)}</Nm>
                    <Id>
                        <OrgId>
                            <Othr>
                                <Id>${escapeXml(OrgNo)}</Id>
                            </Othr>
                        </OrgId>
                    </Id>
            </InitgPty>
        </GrpHdr>
`;
    paymentGroups.forEach((group, groupIndex) => {

        xml += `
        <PmtInf>
            <PmtInfId>${messageId}-${groupIndex + 1}</PmtInfId>
            <PmtMtd>TRF</PmtMtd>
            ${group.isSalary ? `
            <PmtTpInf>
                <CtgyPurp>
                    <Cd>SALA</Cd>
                </CtgyPurp>
            </PmtTpInf>` : ""}
            <ReqdExctnDt>${formatLBDate(group.executionDate)}</ReqdExctnDt>
            <Dbtr>
                <Nm>${escapeXml(companyName)}</Nm>
            </Dbtr>
            <DbtrAcct>
                <Id>
                    <Othr>
                        <Id>${escapeXml(debtBG)}</Id>
                        <SchmeNm>
                            <Prtry>BGNR</Prtry>
                        </SchmeNm>
                    </Othr>
                </Id>
            </DbtrAcct>
            <DbtrAgt>
                <FinInstnId>
                    <BIC>ELLFSESS</BIC>
                </FinInstnId>
            </DbtrAgt>`;

        group.payments.forEach(payment => {

            xml += `
            <CdtTrfTxInf>
                <PmtId>
                    <EndToEndId>E2E-${transactionIndex++}</EndToEndId>
                </PmtId>
                <Amt>
                    <InstdAmt Ccy="SEK">${payment.amount.toFixed(2)}</InstdAmt>
                </Amt>
                ${payment.isBgNumber ? `
                <CdtrAgt>
                    <FinInstnId>
                        <ClrSysMmbId>
                            <ClrSysId>
                                <Cd>SESBA</Cd>
                            </ClrSysId>
                            <MmbId>9900</MmbId>
                        </ClrSysMmbId>
                    </FinInstnId>
                </CdtrAgt>` : ""}
                <Cdtr>
                    <Nm>${escapeXml(payment.name || "Not Provided")}</Nm>
                </Cdtr>
                <CdtrAcct>
                    <Id>
                        <Othr>
                            <Id>${escapeXml(payment.account)}</Id>
                            <SchmeNm>
                                ${payment.isBgNumber
                            ? `<Prtry>BGNR</Prtry>`
                            : `<Cd>BBAN</Cd>`}
                            </SchmeNm>
                        </Othr>
                    </Id>
                </CdtrAcct>
                <RmtInf>
                    <Ustrd>${escapeXml(payment.reference)}</Ustrd>
                </RmtInf>
            </CdtTrfTxInf>`;
        });

        xml += `
        </PmtInf>`;
    });

    xml += `
    </CstmrCdtTrfInitn>
</Document>
`;

    return xml.replace(/\n\s*\n/g, "\n");
}


function formatLBDate(value){

    const date = value.trim();

    return "20" + date.substring(0,2) + "-" +
        date.substring(2,4) + "-" +
        date.substring(4,6);
}


function formatMessageDate(date){

    const twoDigits = value => String(value).padStart(2,"0");

    return String(date.getFullYear()).substring(2,4) +
        twoDigits(date.getMonth() + 1) +
        twoDigits(date.getDate()) +
        twoDigits(date.getHours()) +
        twoDigits(date.getMinutes());
}


function formatShortDate(date){

    const twoDigits = value => String(value).padStart(2,"0");

    return String(date.getFullYear()).substring(2,4) +
        twoDigits(date.getMonth() + 1) +
        twoDigits(date.getDate());
}


function downloadXML(xml, fileName){

    const blob =
        new Blob(
            [xml],
            {type:"application/xml"}
        );

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download = fileName;

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}


function showStatus(text,error){

    const status =
        document.getElementById("status");

    status.textContent = text;

    if(error){
        status.className = "status error";
    }
    else{
        status.className = "status success";
    }
}


function escapeXml(value){

    return value
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&apos;");
}

</script>

</body>
</html>
